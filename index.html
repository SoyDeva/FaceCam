<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b11" />
    <meta name="description" content="FaceCam: grabación local con máscaras faciales 3D." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="facecam-build" content="69bcfbd1096d3a699838698d0a449a7140036bf7" />
    <title>FaceCam</title>
    <script>
      (() => {
        const currentBuild = document
          .querySelector('meta[name="facecam-build"]')
          ?.getAttribute('content')

        if (!currentBuild || currentBuild.startsWith('%')) return

        const versionUrl = new URL('./version.json', window.location.href)
        versionUrl.searchParams.set('cacheBust', Date.now().toString())

        fetch(versionUrl, { cache: 'no-store' })
          .then((response) => response.ok ? response.json() : null)
          .then((deployment) => {
            const deployedBuild = deployment?.sha
            if (!deployedBuild || deployedBuild === currentBuild) return

            const reloadKey = 'facecam:last-deployment-reload'
            if (sessionStorage.getItem(reloadKey) === deployedBuild) return
            sessionStorage.setItem(reloadKey, deployedBuild)

            const nextUrl = new URL(window.location.href)
            nextUrl.searchParams.set('facecamBuild', deployedBuild.slice(0, 12))
            window.location.replace(nextUrl.toString())
          })
          .catch(() => undefined)
      })()
    </script>
    <script type="module" crossorigin src="/FaceCam/assets/index-Cl7dfDaW.js"></script>
    <link rel="stylesheet" crossorigin href="/FaceCam/assets/index-vUK-DvL1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
