name: Apply download lifetime hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-download-lifetime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch browser download lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/camera/CameraStudio.tsx')
          text = path.read_text()
          old = """      const anchor = document.createElement('a')
      anchor.href = url
      anchor.download = file.name
      anchor.click()
      window.setTimeout(() => URL.revokeObjectURL(url), 30_000)
"""
          new = """      const anchor = document.createElement('a')
      anchor.href = url
      anchor.download = file.name
      anchor.style.display = 'none'
      document.body.appendChild(anchor)
      anchor.click()
      anchor.remove()
      window.setTimeout(() => URL.revokeObjectURL(url), 30 * 60 * 1_000)
"""
          if old not in text:
              raise SystemExit('Expected download block was not found.')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/camera/CameraStudio.tsx
          git commit -m "Keep download URL alive for large recordings"
          git push

# Second push activates this registered workflow.
