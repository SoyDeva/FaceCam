name: Enable native v7 blink

on:
  push:
    branches:
      - agent/native-v7-blink

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-v7-blink
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Connect live blink to native GLB morphs
        run: node scripts/enable-native-v7-blink.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate dragon
        run: npm run validate:dragon
      - name: Build
        run: npm run build
      - name: Commit validated renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drive v7 eyelids through native GLB morphs"
          git push origin HEAD:agent/native-v7-blink
