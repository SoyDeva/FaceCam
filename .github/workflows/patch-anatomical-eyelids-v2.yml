name: Patch anatomical eyelids v2

on:
  push:
    branches:
      - agent/anatomical-eyelid-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/anatomical-eyelid-fallback
          fetch-depth: 0

      - name: Patch renderer
        run: python scripts/patch-anatomical-eyelids.py

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

      - name: Commit renderer integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/masks/three/StaticDragonRenderer.ts
          git commit -m "Integrate anatomical eyelid fallback"
          git push origin HEAD:agent/anatomical-eyelid-fallback
