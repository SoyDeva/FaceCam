name: Apply renderer v2

on:
  push:
    branches:
      - agent/facial-response-celestial-aura-v2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[renderer-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/facial-response-celestial-aura-v2
          fetch-depth: 0
      - name: Rebuild renderer source
        run: |
          cat patches/renderer-v2/*.b64 | base64 --decode > src/masks/three/StaticDragonRenderer.ts
      - name: Commit renderer
        run: |
          git config user.name "FaceCam Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/masks/three/StaticDragonRenderer.ts
          git commit -m "Apply celestial aura renderer v2 [renderer-v2]"
          git push origin HEAD:agent/facial-response-celestial-aura-v2
