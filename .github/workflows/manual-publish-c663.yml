name: Manual publish c663

on:
  push:
    branches:
      - agent/stop-blink-mouth-crosstalk
    paths:
      - '.github/workflows/manual-publish-c663.yml'

permissions:
  contents: write

concurrency:
  group: facecam-manual-c663
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c663d5d56b2cd56b8acae8b609619326353213ab
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Stamp deployment version
        run: |
          mkdir -p public
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            'c663d5d56b2cd56b8acae8b609619326353213ab' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > public/version.json
      - name: Build production bundle
        env:
          VITE_FACECAM_BUILD_SHA: c663d5d56b2cd56b8acae8b609619326353213ab
        run: npm run build
      - name: Verify final bundle
        run: |
          set -euo pipefail
          grep -R -Fq 'FaceCam-Dragon-Blanco-Rigged-CORRECTO-v7.glb' dist
          grep -R -Fq '7ee6ef7403768012f97c8370c480ea3b7a5e1e96fe92ad61d9e277c481ea9e5e' dist
          grep -R -Fq 'El modelo guardado no activó el rig facial del Dragón Blanco v7.' dist
          test -s dist/version.json
      - name: Publish exact build to gh-pages
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/facecam-gh-pages
          git worktree add /tmp/facecam-gh-pages gh-pages
          find /tmp/facecam-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/facecam-gh-pages/
          touch /tmp/facecam-gh-pages/.nojekyll
          cd /tmp/facecam-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
          else
            git commit -m 'Deploy FaceCam from c663d5d56b2cd56b8acae8b609619326353213ab'
            git push origin gh-pages
          fi
