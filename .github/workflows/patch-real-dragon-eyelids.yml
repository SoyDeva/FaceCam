name: Patch real dragon eyelids

on:
  push:
    branches:
      - agent/real-dragon-eyelids

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/real-dragon-eyelids
          fetch-depth: 0

      - name: Replace overlays with dragon mesh deformation
        run: python scripts/patch-real-dragon-eyelids.py

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:dragon
      - run: npm run build

      - name: Commit validated dragon eyelid rig
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make the dragon's real eyes blink"
          git push origin HEAD:agent/real-dragon-eyelids
