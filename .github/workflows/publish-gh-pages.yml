name: Publish GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/publish-gh-pages.yml'
      - '.github/workflows/publish-gh-pages-branch.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: facecam-pages-deployment
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == '[FaceCam] Deploy live eye fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:dragon
      - name: Stamp deployment version
        run: |
          mkdir -p public
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$(git rev-parse HEAD)" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > public/version.json
      - name: Build production bundle
        env:
          VITE_FACECAM_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify GLB v28 corrected-neutral installer bundle
        run: |
          set -euo pipefail
          obsolete='FaceCam-Dragon-Blanco-HYBRID-v27.glb'
          corrected='El modelo guardado no activó la malla única v28 con sello neutro corregido y ambos párpados.'
          model='FaceCam-Dragon-Blanco-HYBRID-v28.glb'
          fingerprint='8a5bf57dec3b17f0ae664ed7c37ae399c008820a72643efc6a5d03b655563692'
          singleSource='FaceCamSingleSourceDragon'

          if grep -R -Fq "$obsolete" dist; then
            echo "::error::El paquete todavía solicita el GLB v27 con el neutral defectuoso."
            exit 1
          fi

          if ! grep -R -Fq "$corrected" dist; then
            echo "::error::El paquete no contiene la validación del neutral corregido v28."
            exit 1
          fi

          if ! grep -R -Fq "$model" dist; then
            echo "::error::El paquete no solicita el GLB v28 oficial."
            exit 1
          fi

          if ! grep -R -Fq "$fingerprint" dist; then
            echo "::error::El paquete no contiene la huella SHA-256 del GLB v28."
            exit 1
          fi

          if ! grep -R -Fq "$singleSource" dist; then
            echo "::error::El paquete no contiene el nodo único $singleSource."
            exit 1
          fi

          for discardedNode in FaceCamNeutralHead FaceCamNeutralMouth FaceCamOpenFullSource FaceCamNeutralUpperSeam FaceCamNeutralUpperMuzzle FaceCamUpperMuzzleBridge; do
            if grep -R -Fq "$discardedNode" dist; then
              echo "::error::El paquete v28 todavía contiene un nodo multi-topología descartado: $discardedNode."
              exit 1
            fi
          done

          test -s dist/version.json
      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/facecam-gh-pages
          git worktree add /tmp/facecam-gh-pages gh-pages
          find /tmp/facecam-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/facecam-gh-pages/
          touch /tmp/facecam-gh-pages/.nojekyll
          cd /tmp/facecam-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy FaceCam from $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            git push origin gh-pages
          fi
