name: Publish GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/publish-gh-pages.yml'
      - '.github/workflows/publish-gh-pages-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: facecam-pages-deployment
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Stamp deployment version
        run: |
          mkdir -p public
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > public/version.json
      - name: Build production bundle
        env:
          VITE_FACECAM_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify GLB v5 installer bundle
        run: |
          set -euo pipefail
          obsolete='FaceCam-Dragon-Blanco-Rigged-CORRECTO-v4.glb'
          corrected='El modelo guardado no activó el rig facial del Dragón Blanco v5.'
          model='FaceCam-Dragon-Blanco-Rigged-CORRECTO-v5.glb'
          fingerprint='2974535b1e3651d089b00b675f5c9e4c135cd3f59427a6fc9ebbf67a735e0114'

          if grep -R -Fq "$obsolete" dist; then
            echo "::error::El paquete todavía solicita el GLB v4 defectuoso."
            exit 1
          fi

          if ! grep -R -Fq "$corrected" dist; then
            echo "::error::El paquete no contiene la validación facial v5."
            exit 1
          fi

          if ! grep -R -Fq "$model" dist; then
            echo "::error::El paquete no solicita el GLB v5 oficial."
            exit 1
          fi

          if ! grep -R -Fq "$fingerprint" dist; then
            echo "::error::El paquete no contiene la huella SHA-256 del GLB v5."
            exit 1
          fi

          test -s dist/version.json
      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/facecam-gh-pages
          git worktree add /tmp/facecam-gh-pages gh-pages
          find /tmp/facecam-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/facecam-gh-pages/
          touch /tmp/facecam-gh-pages/.nojekyll
          cd /tmp/facecam-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy FaceCam from ${GITHUB_SHA}"
            git push origin gh-pages
          fi
