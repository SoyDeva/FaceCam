name: Publish GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/publish-gh-pages.yml'
      - '.github/workflows/publish-gh-pages-branch.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: facecam-pages-deployment
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == '[FaceCam] Deploy live eye fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:dragon
      - name: Stamp deployment version
        run: |
          mkdir -p public
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$(git rev-parse HEAD)" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > public/version.json
      - name: Build production bundle
        env:
          VITE_FACECAM_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify GLB v12 dual-source installer bundle
        run: |
          set -euo pipefail
          obsolete='FaceCam-Dragon-Blanco-Rigged-CORRECTO-v11.glb'
          corrected='El modelo guardado no activó el rig facial dual del Dragón Blanco v12.'
          model='FaceCam-Dragon-Blanco-DUAL-SOURCE-v12.glb'
          fingerprint='dc1d3cc2c64877e85785a53214240d98a53730fac3f2e721b4184ee3946aa698'
          runtime='FaceCamNeutralSource'

          if grep -R -Fq "$obsolete" dist; then
            echo "::error::El paquete todavía solicita el GLB v11 con neutral reconstruido sobre la topología abierta."
            exit 1
          fi

          if ! grep -R -Fq "$corrected" dist; then
            echo "::error::El paquete no contiene la validación facial dual v12."
            exit 1
          fi

          if ! grep -R -Fq "$model" dist; then
            echo "::error::El paquete no solicita el GLB dual-source v12 oficial."
            exit 1
          fi

          if ! grep -R -Fq "$fingerprint" dist; then
            echo "::error::El paquete no contiene la huella SHA-256 del GLB v12."
            exit 1
          fi

          if ! grep -R -Fq "$runtime" dist; then
            echo "::error::El paquete no contiene la selección runtime de topologías neutral/abierta."
            exit 1
          fi

          test -s dist/version.json
      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/facecam-gh-pages
          git worktree add /tmp/facecam-gh-pages gh-pages
          find /tmp/facecam-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/facecam-gh-pages/
          touch /tmp/facecam-gh-pages/.nojekyll
          cd /tmp/facecam-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy FaceCam from $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            git push origin gh-pages
          fi
