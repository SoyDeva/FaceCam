name: Publish GitHub Pages branch

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/publish-gh-pages.yml'
      - '.github/workflows/publish-gh-pages-branch.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: facecam-pages-deployment
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == '[FaceCam] Deploy live eye fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:dragon
      - name: Stamp deployment version
        run: |
          mkdir -p public
          printf '{"sha":"%s","builtAt":"%s"}\n' \
            "$(git rev-parse HEAD)" \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            > public/version.json
      - name: Build production bundle
        env:
          VITE_FACECAM_BUILD_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify GLB v26 complete-source installer bundle
        run: |
          set -euo pipefail
          obsolete='FaceCam-Dragon-Blanco-HYBRID-v25.glb'
          corrected='El modelo guardado no activó la arquitectura de fuentes completas del Dragón Blanco v26.'
          model='FaceCam-Dragon-Blanco-HYBRID-v26.glb'
          fingerprint='1f2398dfdbc2ca8db0afeee1cdabe48812594bb0bfc18b15e16fb4240e1d7583'
          neutralHead='FaceCamNeutralHead'
          neutralMouth='FaceCamNeutralMouth'
          openFull='FaceCamOpenFullSource'

          if grep -R -Fq "$obsolete" dist; then
            echo "::error::El paquete todavía solicita el GLB v25 con empalme regional."
            exit 1
          fi

          if ! grep -R -Fq "$corrected" dist; then
            echo "::error::El paquete no contiene la validación de fuentes completas v26."
            exit 1
          fi

          if ! grep -R -Fq "$model" dist; then
            echo "::error::El paquete no solicita el GLB v26 oficial."
            exit 1
          fi

          if ! grep -R -Fq "$fingerprint" dist; then
            echo "::error::El paquete no contiene la huella SHA-256 del GLB v26."
            exit 1
          fi

          for runtimeNode in "$neutralHead" "$neutralMouth" "$openFull"; do
            if ! grep -R -Fq "$runtimeNode" dist; then
              echo "::error::El paquete no contiene el nodo runtime $runtimeNode."
              exit 1
            fi
          done

          for discardedNode in FaceCamNeutralUpperSeam FaceCamNeutralUpperMuzzle FaceCamUpperMuzzleBridge; do
            if grep -R -Fq "$discardedNode" dist; then
              echo "::error::El paquete v26 todavía contiene un nodo de empalme descartado: $discardedNode."
              exit 1
            fi
          done

          test -s dist/version.json
      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          rm -rf /tmp/facecam-gh-pages
          git worktree add /tmp/facecam-gh-pages gh-pages
          find /tmp/facecam-gh-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R dist/. /tmp/facecam-gh-pages/
          touch /tmp/facecam-gh-pages/.nojekyll
          cd /tmp/facecam-gh-pages
          git add -A
          if git diff --cached --quiet; then
            echo "No deployment changes."
          else
            git commit -m "Deploy FaceCam from $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            git push origin gh-pages
          fi
